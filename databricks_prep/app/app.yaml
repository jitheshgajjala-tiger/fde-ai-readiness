# Add the resources required by the assignments you are deploying.
# Resource keys (the names you give each resource in the Apps UI) must match the valueFrom values below.
command: ['streamlit', 'run', 'app.py']
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: ORDERS_TABLE
    value: 'workspace.fde_prep.fact_orders'
  - name: USE_USER_AUTH
    value: 'false'
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: 'false'
  # Add the matching Genie resource in the Databricks App before deploying.
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
  # TEMPORARY: invalid service name for Assignment 3 failure-path test. Restore valueFrom: model afterward.
  - name: SERVING_ENDPOINT
    value: 'system.ai.assignment_test_missing_model'
